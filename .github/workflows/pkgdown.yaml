# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      UAFR_RUN_LIVE_TESTS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install website dependencies
        run: |
          install.packages(c("BiocManager", "pkgdown", "remotes", "sessioninfo",
                             "knitr", "rmarkdown", "spelling", "testthat",
                             "openxlsx", "writexl"))
          BiocManager::install(c("ChemmineR", "fmcsR"), ask = FALSE,
                               update = FALSE,
                               dependencies = c("Depends", "Imports",
                                                "LinkingTo"))
          remotes::install_deps(dependencies = c("Depends", "Imports",
                                                 "LinkingTo"),
                                upgrade = "never")
        shell: Rscript {0}

      - name: Build site
        run: |
          pkgdown::check_pkgdown()
          pkgdown::build_site(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      - name: Upload private documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: uafR-pkgdown-${{ github.sha }}
          path: docs
          if-no-files-found: error
