on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: "release"}
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      UAFR_RUN_LIVE_TESTS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install package dependencies
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("BiocManager", "rcmdcheck", "testthat", "knitr",
                             "rmarkdown", "spelling", "openxlsx", "writexl",
                             "jsonlite", "webchem", "curl", "remotes"))
          BiocManager::install(c("ChemmineR", "fmcsR"), ask = FALSE,
                               update = FALSE,
                               dependencies = c("Depends", "Imports",
                                                "LinkingTo"))
        shell: Rscript {0}

      - name: Check built source package
        run: Rscript tools/check_package_release.R
        shell: bash
